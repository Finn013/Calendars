<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <title>Календарь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --primary-light: #818CF8;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg: #F9FAFB;
            --surface: #FFFFFF;
            --text: #111827;
            --text-secondary: #6B7280;
            --border: #E5E7EB;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .container {
            max-width: 100%;
            min-height: 100vh;
            padding: 0;
        }

        /* Header */
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            box-shadow: 0 2px 10px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-primary:active {
            transform: scale(0.95);
            background: var(--bg);
        }
        
        .btn-primary.active {
            background: var(--primary-dark);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-icon {
            padding: 10px;
            min-width: 40px;
            justify-content: center;
        }

        /* Navigation */
        .nav {
            background: var(--surface);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px var(--shadow);
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
        }

        .nav-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:active {
            background: var(--bg);
            transform: scale(0.9);
        }

        /* Stats */
        .stats {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px;
            margin: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .stat-item {
            flex: 1;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
        }

        /* Year View */
        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .month-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px var(--shadow);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .month-card:active {
            transform: scale(0.98);
            border-color: var(--primary);
        }

        .month-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }

        .month-card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
        }

        .month-card-hours {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(79, 70, 229, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .month-mini-calendar {
            font-size: 10px;
        }

        .month-mini-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            margin-bottom: 4px;
        }

        .month-mini-weekday {
            text-align: center;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 2px 0;
            font-size: 9px;
        }

        .month-mini-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .month-mini-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: var(--bg);
            font-size: 10px;
            font-weight: 500;
            position: relative;
        }

        .month-mini-day.empty {
            background: transparent;
        }

        .month-mini-day.today {
            background: var(--primary);
            color: white;
            font-weight: 700;
        }

        .month-mini-day.has-hours {
            background: rgba(79, 70, 229, 0.15);
            color: var(--primary);
            font-weight: 600;
        }

        .month-mini-day.has-hours::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 3px;
            background: var(--primary);
            border-radius: 50%;
        }

        /* Month View */
        .calendar {
            padding: 15px;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .weekday {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 0;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-cell {
            aspect-ratio: 1;
            background: var(--surface);
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px var(--shadow);
            border: 2px solid transparent;
            position: relative;
        }

        .day-cell:active {
            transform: scale(0.95);
        }

        .day-cell.empty {
            background: transparent;
            box-shadow: none;
            cursor: default;
        }

        .day-cell.today {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .day-cell.has-hours {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.1) 0%, rgba(79, 70, 229, 0.2) 100%);
        }

        .day-number {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .day-hours {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
        }

        .day-tasks-indicator {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
        }

        /* Day View */
        .day-view {
            padding: 15px;
        }

        .day-header {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .day-date {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 15px;
        }

        .time-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .time-input-label {
            font-size: 14px;
            color: var(--text-secondary);
            min-width: 80px;
        }

        .time-input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .time-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .time-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* Tasks */
        .tasks-section {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tasks-title {
            font-size: 16px;
            font-weight: 600;
        }

        .add-task-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-task-btn:active {
            transform: scale(0.9);
            background: var(--primary-dark);
        }

        .task-input-container {
            display: none;
            margin-bottom: 15px;
            animation: slideDown 0.2s ease;
        }

        .task-input-container.active {
            display: flex;
            gap: 8px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        .task-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .task-save-btn {
            padding: 12px 20px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .task-save-btn:active {
            transform: scale(0.95);
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .task-checkbox.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .task-checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: 700;
        }

        .task-text {
            flex: 1;
            font-size: 14px;
            transition: all 0.2s;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-delete {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: transparent;
            color: var(--danger);
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task-delete:active {
            background: rgba(239, 68, 68, 0.1);
            transform: scale(0.9);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .modal-body {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-btn-primary {
            background: var(--primary);
            color: white;
        }

        .modal-btn-primary:active {
            background: var(--primary-dark);
            transform: scale(0.98);
        }

        .modal-btn-secondary {
            background: var(--bg);
            color: var(--text);
        }

        .modal-btn-secondary:active {
            background: var(--border);
            transform: scale(0.98);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 2000;
            opacity: 0;
            transition: all 0.3s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        /* Loading */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1500;
            align-items: center;
            justify-content: center;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .header-title {
                font-size: 16px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 13px;
            }
            
            .btn span {
                display: none;
            }

            .stat-value {
                font-size: 20px;
            }

            .year-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 10px;
            }
            
            .month-card {
                padding: 10px;
            }
            
            .month-card-title {
                font-size: 13px;
            }
            
            .month-card-hours {
                font-size: 11px;
            }
        }
        
        @media (min-width: 768px) {
            .year-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (min-width: 1200px) {
            .year-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="header-title" id="headerTitle">Календарь</div>
                <div class="header-buttons">
                    <button class="btn btn-secondary btn-icon" id="backBtn" style="display: none;">←</button>
                    <button class="btn btn-primary" id="viewMonthBtn">📅<span> Месяц</span></button>
                    <button class="btn btn-primary" id="viewYearBtn">📊<span> Год</span></button>
                    <button class="btn btn-primary" id="exportBtn">💾</button>
                    <button class="btn btn-primary" id="importBtn">📂</button>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav" id="navigation">
            <div class="nav-title" id="navTitle">2026</div>
            <div class="nav-controls">
                <button class="nav-btn" id="prevBtn">←</button>
                <button class="nav-btn" id="todayBtn">📅</button>
                <button class="nav-btn" id="nextBtn">→</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsSection">
            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-label">Всего часов</div>
                    <div class="stat-value" id="totalHours">0:00</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Дней с записями</div>
                    <div class="stat-value" id="totalDays">0</div>
                </div>
            </div>
        </div>

        <!-- Year View -->
        <div id="yearView" class="year-grid"></div>

        <!-- Month View -->
        <div id="monthView" class="hidden">
            <div class="calendar">
                <div class="calendar-weekdays">
                    <div class="weekday">ПН</div>
                    <div class="weekday">ВТ</div>
                    <div class="weekday">СР</div>
                    <div class="weekday">ЧТ</div>
                    <div class="weekday">ПТ</div>
                    <div class="weekday">СБ</div>
                    <div class="weekday">ВС</div>
                </div>
                <div class="calendar-days" id="calendarDays"></div>
            </div>
        </div>

        <!-- Day View -->
        <div id="dayView" class="hidden">
            <div class="day-view">
                <div class="day-header">
                    <div class="day-date" id="dayDate"></div>
                    <div class="time-input-group">
                        <span class="time-input-label">Время:</span>
                        <input type="text" class="time-input" id="hoursInput" placeholder="0.00" inputmode="decimal">
                    </div>
                    <div class="time-hint">Формат: часы.минуты (например, 8.30 = 8 часов 30 минут)</div>
                </div>

                <div class="tasks-section">
                    <div class="tasks-header">
                        <div class="tasks-title">Задачи</div>
                        <button class="add-task-btn" id="addTaskBtn">+</button>
                    </div>
                    
                    <div class="task-input-container" id="taskInputContainer">
                        <input type="text" class="task-input" id="taskInput" placeholder="Введите задачу...">
                        <button class="task-save-btn" id="saveTaskBtn">✓</button>
                    </div>

                    <div class="tasks-list" id="tasksList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle"></div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-buttons" id="modalButtons"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".json" style="display: none;">

    <script>
        // Состояние приложения
        const app = {
            currentView: 'month',
            currentYear: new Date().getFullYear(),
            currentMonth: new Date().getMonth(),
            currentDay: null,
            data: {}
        };

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            showMonthView();
            setupEventListeners();
        });

        // Загрузка данных из localStorage
        function loadData() {
            const saved = localStorage.getItem('timeTrackerData');
            if (saved) {
                try {
                    app.data = JSON.parse(saved);
                } catch (e) {
                    console.error('Ошибка загрузки данных:', e);
                    app.data = {};
                }
            }
        }

        // Сохранение данных в localStorage
        function saveData() {
            localStorage.setItem('timeTrackerData', JSON.stringify(app.data));
        }

        // Получение ключа даты
        function getDateKey(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        // Парсинг времени из формата ч.мм
        function parseTime(timeStr) {
            if (!timeStr) return 0;
            const parts = String(timeStr).split('.');
            const hours = parseInt(parts[0]) || 0;
            const minutes = parseInt(parts[1]) || 0;
            
            // Проверка корректности минут
            if (minutes >= 60) {
                showToast('Минуты должны быть от 0 до 59', 'error');
                return 0;
            }
            
            return hours * 60 + minutes; // Возвращаем общее количество минут
        }

        // Форматирование времени в ч.мм
        function formatTime(minutes) {
            if (!minutes) return '0:00';
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours}:${String(mins).padStart(2, '0')}`;
        }

        // Получение данных дня
        function getDayData(year, month, day) {
            const key = getDateKey(year, month, day);
            if (!app.data[key]) {
                app.data[key] = {
                    hours: '',
                    tasks: []
                };
            }
            return app.data[key];
        }

        // Подсчёт часов за месяц
        function calculateMonthHours(year, month) {
            let totalMinutes = 0;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let day = 1; day <= daysInMonth; day++) {
                const key = getDateKey(year, month, day);
                if (app.data[key] && app.data[key].hours) {
                    totalMinutes += parseTime(app.data[key].hours);
                }
            }
            
            return totalMinutes;
        }

        // Подсчёт часов за год
        function calculateYearHours(year) {
            let totalMinutes = 0;
            for (let month = 0; month < 12; month++) {
                totalMinutes += calculateMonthHours(year, month);
            }
            return totalMinutes;
        }

        // Подсчёт дней с записями за месяц
        function countDaysWithHours(year, month) {
            let count = 0;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            for (let day = 1; day <= daysInMonth; day++) {
                const key = getDateKey(year, month, day);
                if (app.data[key] && app.data[key].hours) {
                    count++;
                }
            }
            
            return count;
        }

        // Названия месяцев
        const monthNames = [
            'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
        ];

        // Показать вид года
        function showYearView() {
            app.currentView = 'year';
            document.getElementById('yearView').classList.remove('hidden');
            document.getElementById('monthView').classList.add('hidden');
            document.getElementById('dayView').classList.add('hidden');
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('navTitle').textContent = app.currentYear;
            
            // Подсветка активной кнопки
            document.getElementById('viewMonthBtn').classList.remove('active');
            document.getElementById('viewYearBtn').classList.add('active');
            
            renderYearView();
            updateStats();
        }

        // Отрисовка вида года
        function renderYearView() {
            const yearView = document.getElementById('yearView');
            yearView.innerHTML = '';
            
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth();
            const currentDay = today.getDate();
            
            for (let month = 0; month < 12; month++) {
                const totalMinutes = calculateMonthHours(app.currentYear, month);
                
                const card = document.createElement('div');
                card.className = 'month-card';
                
                // Заголовок месяца с суммой часов
                const header = document.createElement('div');
                header.className = 'month-card-header';
                header.innerHTML = `
                    <div class="month-card-title">${monthNames[month]}</div>
                    <div class="month-card-hours">${formatTime(totalMinutes)}</div>
                `;
                card.appendChild(header);
                
                // Мини-календарь
                const miniCal = document.createElement('div');
                miniCal.className = 'month-mini-calendar';
                
                // Дни недели
                const weekdaysDiv = document.createElement('div');
                weekdaysDiv.className = 'month-mini-weekdays';
                const weekdayNames = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];
                weekdayNames.forEach(name => {
                    const wd = document.createElement('div');
                    wd.className = 'month-mini-weekday';
                    wd.textContent = name;
                    weekdaysDiv.appendChild(wd);
                });
                miniCal.appendChild(weekdaysDiv);
                
                // Дни месяца
                const daysDiv = document.createElement('div');
                daysDiv.className = 'month-mini-days';
                
                const firstDay = new Date(app.currentYear, month, 1).getDay();
                const daysInMonth = new Date(app.currentYear, month + 1, 0).getDate();
                
                // Корректировка для понедельника как первого дня
                const offset = firstDay === 0 ? 6 : firstDay - 1;
                
                // Пустые ячейки
                for (let i = 0; i < offset; i++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'month-mini-day empty';
                    daysDiv.appendChild(emptyDay);
                }
                
                // Дни месяца
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayData = getDayData(app.currentYear, month, day);
                    const isToday = app.currentYear === currentYear && 
                                   month === currentMonth && 
                                   day === currentDay;
                    
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'month-mini-day';
                    if (isToday) dayDiv.classList.add('today');
                    if (dayData.hours) dayDiv.classList.add('has-hours');
                    dayDiv.textContent = day;
                    daysDiv.appendChild(dayDiv);
                }
                
                miniCal.appendChild(daysDiv);
                card.appendChild(miniCal);
                
                card.onclick = () => showMonthView(month);
                yearView.appendChild(card);
            }
        }

        // Склонение слова "день"
        function getDaysWord(count) {
            if (count % 10 === 1 && count % 100 !== 11) return 'день';
            if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) return 'дня';
            return 'дней';
        }

        // Показать вид месяца
        function showMonthView(month = app.currentMonth) {
            app.currentView = 'month';
            app.currentMonth = month;
            document.getElementById('yearView').classList.add('hidden');
            document.getElementById('monthView').classList.remove('hidden');
            document.getElementById('dayView').classList.add('hidden');
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('navTitle').textContent = `${monthNames[month]} ${app.currentYear}`;
            
            // Подсветка активной кнопки
            document.getElementById('viewMonthBtn').classList.add('active');
            document.getElementById('viewYearBtn').classList.remove('active');
            
            renderMonthView();
            updateStats();
        }

        // Отрисовка вида месяца
        function renderMonthView() {
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';
            
            const firstDay = new Date(app.currentYear, app.currentMonth, 1).getDay();
            const daysInMonth = new Date(app.currentYear, app.currentMonth + 1, 0).getDate();
            const today = new Date();
            
            // Корректировка для понедельника как первого дня недели
            const offset = firstDay === 0 ? 6 : firstDay - 1;
            
            // Пустые ячейки
            for (let i = 0; i < offset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                calendarDays.appendChild(emptyCell);
            }
            
            // Дни месяца
            for (let day = 1; day <= daysInMonth; day++) {
                const dayData = getDayData(app.currentYear, app.currentMonth, day);
                const isToday = today.getFullYear() === app.currentYear && 
                               today.getMonth() === app.currentMonth && 
                               today.getDate() === day;
                
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (isToday) cell.classList.add('today');
                if (dayData.hours) cell.classList.add('has-hours');
                
                let content = `<div class="day-number">${day}</div>`;
                if (dayData.hours) {
                    const minutes = parseTime(dayData.hours);
                    content += `<div class="day-hours">${formatTime(minutes)}</div>`;
                }
                if (dayData.tasks && dayData.tasks.length > 0) {
                    content += `<div class="day-tasks-indicator"></div>`;
                }
                
                cell.innerHTML = content;
                cell.onclick = () => showDayView(day);
                calendarDays.appendChild(cell);
            }
        }

        // Показать вид дня
        function showDayView(day) {
            app.currentView = 'day';
            app.currentDay = day;
            document.getElementById('yearView').classList.add('hidden');
            document.getElementById('monthView').classList.add('hidden');
            document.getElementById('dayView').classList.remove('hidden');
            document.getElementById('backBtn').style.display = 'flex';
            
            // Убираем подсветку с кнопок видов
            document.getElementById('viewMonthBtn').classList.remove('active');
            document.getElementById('viewYearBtn').classList.remove('active');
            
            const date = new Date(app.currentYear, app.currentMonth, day);
            const weekdays = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
            document.getElementById('navTitle').textContent = `${day} ${monthNames[app.currentMonth]}`;
            document.getElementById('dayDate').textContent = 
                `${day} ${monthNames[app.currentMonth]} ${app.currentYear}, ${weekdays[date.getDay()]}`;
            
            const dayData = getDayData(app.currentYear, app.currentMonth, day);
            document.getElementById('hoursInput').value = dayData.hours || '';
            
            renderTasks();
            updateStats();
        }

        // Отрисовка задач
        function renderTasks() {
            const dayData = getDayData(app.currentYear, app.currentMonth, app.currentDay);
            const tasksList = document.getElementById('tasksList');
            
            if (!dayData.tasks || dayData.tasks.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📜</div>
                        <div>Нет задач на этот день</div>
                    </div>
                `;
                return;
            }
            
            tasksList.innerHTML = '';
            dayData.tasks.forEach((task, index) => {
                const taskItem = document.createElement('div');
                taskItem.className = 'task-item';
                taskItem.innerHTML = `
                    <div class="task-checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${index})"></div>
                    <div class="task-text ${task.completed ? 'completed' : ''}">${task.text}</div>
                    <button class="task-delete" onclick="deleteTask(${index})">×</button>
                `;
                tasksList.appendChild(taskItem);
            });
        }

        // Переключение статуса задачи
        function toggleTask(index) {
            const dayData = getDayData(app.currentYear, app.currentMonth, app.currentDay);
            dayData.tasks[index].completed = !dayData.tasks[index].completed;
            saveData();
            renderTasks();
        }

        // Удаление задачи
        function deleteTask(index) {
            const dayData = getDayData(app.currentYear, app.currentMonth, app.currentDay);
            dayData.tasks.splice(index, 1);
            saveData();
            renderTasks();
            showToast('Задача удалена', 'success');
        }

        // Обновление статистики
        function updateStats() {
            let totalMinutes = 0;
            let totalDays = 0;
            
            if (app.currentView === 'year') {
                totalMinutes = calculateYearHours(app.currentYear);
                for (let month = 0; month < 12; month++) {
                    totalDays += countDaysWithHours(app.currentYear, month);
                }
            } else {
                totalMinutes = calculateMonthHours(app.currentYear, app.currentMonth);
                totalDays = countDaysWithHours(app.currentYear, app.currentMonth);
            }
            
            document.getElementById('totalHours').textContent = formatTime(totalMinutes);
            document.getElementById('totalDays').textContent = totalDays;
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            // Переключение видов
            document.getElementById('viewMonthBtn').onclick = () => {
                if (app.currentView !== 'month') {
                    const today = new Date();
                    app.currentYear = today.getFullYear();
                    app.currentMonth = today.getMonth();
                    showMonthView();
                }
            };
            
            document.getElementById('viewYearBtn').onclick = () => {
                if (app.currentView !== 'year') {
                    showYearView();
                }
            };
            
            // Навигация
            document.getElementById('backBtn').onclick = () => {
                if (app.currentView === 'day') {
                    showMonthView(app.currentMonth);
                }
            };
            
            document.getElementById('prevBtn').onclick = () => {
                if (app.currentView === 'year') {
                    app.currentYear--;
                    showYearView();
                } else if (app.currentView === 'month') {
                    app.currentMonth--;
                    if (app.currentMonth < 0) {
                        app.currentMonth = 11;
                        app.currentYear--;
                    }
                    showMonthView();
                }
            };
            
            document.getElementById('nextBtn').onclick = () => {
                if (app.currentView === 'year') {
                    app.currentYear++;
                    showYearView();
                } else if (app.currentView === 'month') {
                    app.currentMonth++;
                    if (app.currentMonth > 11) {
                        app.currentMonth = 0;
                        app.currentYear++;
                    }
                    showMonthView();
                }
            };
            
            document.getElementById('todayBtn').onclick = () => {
                const today = new Date();
                app.currentYear = today.getFullYear();
                app.currentMonth = today.getMonth();
                if (app.currentView !== 'month') {
                    showMonthView();
                } else {
                    renderMonthView();
                    updateStats();
                }
            };
            
            // Ввод времени
            document.getElementById('hoursInput').addEventListener('input', (e) => {
                const value = e.target.value;
                const dayData = getDayData(app.currentYear, app.currentMonth, app.currentDay);
                dayData.hours = value;
                saveData();
                updateStats();
            });
            
            // Задачи
            document.getElementById('addTaskBtn').onclick = () => {
                const container = document.getElementById('taskInputContainer');
                container.classList.add('active');
                document.getElementById('taskInput').focus();
            };
            
            document.getElementById('saveTaskBtn').onclick = saveTask;
            
            document.getElementById('taskInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    saveTask();
                }
            });
            
            // Экспорт/Импорт
            document.getElementById('exportBtn').onclick = exportData;
            document.getElementById('importBtn').onclick = () => {
                document.getElementById('fileInput').click();
            };
            
            document.getElementById('fileInput').addEventListener('change', importData);
            
            // Закрытие модального окна
            document.getElementById('modal').onclick = (e) => {
                if (e.target.id === 'modal') {
                    closeModal();
                }
            };
        }

        // Сохранение задачи
        function saveTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            
            if (!text) {
                showToast('Введите текст задачи', 'error');
                return;
            }
            
            const dayData = getDayData(app.currentYear, app.currentMonth, app.currentDay);
            dayData.tasks.push({
                text: text,
                completed: false
            });
            
            saveData();
            input.value = '';
            document.getElementById('taskInputContainer').classList.remove('active');
            renderTasks();
            showToast('Задача добавлена', 'success');
        }

        // Экспорт данных
        function exportData() {
            const dataStr = JSON.stringify(app.data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `time-tracker-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('Данные экспортированы', 'success');
        }

        // Импорт данных
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    
                    showModal(
                        'Импорт данных',
                        'Заменить все текущие данные импортированными?',
                        [
                            {
                                text: 'Отмена',
                                className: 'modal-btn-secondary',
                                onClick: closeModal
                            },
                            {
                                text: 'Заменить',
                                className: 'modal-btn-primary',
                                onClick: () => {
                                    app.data = imported;
                                    saveData();
                                    closeModal();
                                    showToast('Данные импортированы', 'success');
                                    
                                    if (app.currentView === 'year') {
                                        renderYearView();
                                    } else if (app.currentView === 'month') {
                                        renderMonthView();
                                    } else {
                                        renderTasks();
                                        document.getElementById('hoursInput').value = 
                                            getDayData(app.currentYear, app.currentMonth, app.currentDay).hours || '';
                                    }
                                    updateStats();
                                }
                            }
                        ]
                    );
                } catch (error) {
                    showToast('Ошибка чтения файла', 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // Показать модальное окно
        function showModal(title, body, buttons) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').textContent = body;
            
            const buttonsContainer = document.getElementById('modalButtons');
            buttonsContainer.innerHTML = '';
            
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = `modal-btn ${btn.className}`;
                button.textContent = btn.text;
                button.onclick = btn.onClick;
                buttonsContainer.appendChild(button);
            });
            
            document.getElementById('modal').classList.add('active');
        }

        // Закрыть модальное окно
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Показать уведомление
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
